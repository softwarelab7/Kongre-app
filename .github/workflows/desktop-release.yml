name: Desktop Release (Linux Native .rpm, .deb, .AppImage)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag de versión para la compilación (ej. v0.1.0)'
        required: false
        default: ''

jobs:
  # Barrera: un tag no publica instaladores si los tipos o los tests fallan (job solo Linux).
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Tipos (tsc)
        run: npm run lint
      - name: Tests
        run: npm test

  release:
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev libfuse2 file xdg-utils rpm

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Build Desktop Application (Tauri v2 - Linux Native)
        id: tauri_build
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: 1
          NO_STRIP: true
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: "npm run tauri"
          tagName: v__VERSION__
          releaseName: 'Kongre App v__VERSION__'
          releaseBody: 'Instaladores nativos oficiales de Kongre para Linux (.rpm / .deb / .AppImage). Para Windows y macOS, instala la aplicación oficial (PWA) con 1 clic desde https://www.kongre-app.com.'
          releaseDraft: false
          prerelease: false
          args: '--bundles deb,appimage'

      - name: Generate RPM package from DEB (Sanitized Filesystem Ownership)
        run: |
          sudo apt-get update && sudo apt-get install -y alien rpm
          mkdir -p src-tauri/target/release/bundle/rpm
          deb_file=$(ls src-tauri/target/release/bundle/deb/*.deb 2>/dev/null | head -n 1)
          if [ -f "$deb_file" ]; then
            echo "Converting $deb_file to RPM with sanitized spec..."
            sudo alien -g -r --scripts "$deb_file"
            spec_dir=$(ls -d */ | grep -E '^kongre-' | head -n 1)
            if [ -z "$spec_dir" ]; then
              spec_dir=$(ls -d */ | head -n 1)
            fi
            echo "Spec directory: $spec_dir"
            cd "$spec_dir"
            spec_file=$(ls *.spec 2>/dev/null | head -n 1)
            if [ -f "$spec_file" ]; then
              echo "Sanitizing system directory ownership in $spec_file..."
              sudo sed -i -E '/%dir.*"\/(usr|usr\/bin|usr\/share|usr\/share\/applications|usr\/share\/icons|usr\/share\/icons\/hicolor|usr\/share\/icons\/hicolor\/[0-9x]+|usr\/share\/icons\/hicolor\/[0-9x]+\/apps)"/d' "$spec_file"
              sudo sed -i -E '/^"\/(usr|usr\/bin|usr\/share|usr\/share\/applications|usr\/share\/icons)"$/d' "$spec_file"
              sudo rpmbuild --buildroot "$PWD" -bb "$spec_file"
            fi
            cd ..
            generated_rpm=$(find /root/rpmbuild/RPMS /home/runner/rpmbuild/RPMS ./ -name "*.rpm" 2>/dev/null | head -n 1)
            if [ -n "$generated_rpm" ]; then
              TAG_VERSION=$(node -p "require('./package.json').version")
              sudo cp "$generated_rpm" "src-tauri/target/release/bundle/rpm/Kongre-${TAG_VERSION}-1.x86_64.rpm"
              sudo mv "$generated_rpm" src-tauri/target/release/bundle/rpm/
            fi
            ls -la src-tauri/target/release/bundle/rpm/
          fi

      - name: Upload RPM to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v$(node -p "require('./package.json').version")"
          for rpm in src-tauri/target/release/bundle/rpm/*.rpm; do
            if [ -f "$rpm" ]; then
              echo "Uploading $rpm to release $TAG_NAME..."
              gh release upload "$TAG_NAME" "$rpm" --clobber || true
            fi
          done

      - name: Upload Desktop Artifacts to Actions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kongre-desktop-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.sig
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: ignore
