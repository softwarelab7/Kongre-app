name: Desktop Release (Windows, Linux, macOS)

on:
  push:
    # Solo con tags v*: compilar también en main duplicaba los artefactos en la misma release
    # y podía desalinear binarios y firmas de latest.json.
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag de versión para la compilación (ej. v0.1.0)'
        required: false
        default: ''

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: '--bundles nsis'
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: '--bundles deb,appimage'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev libfuse2 file xdg-utils rpm

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps

      - name: Build Desktop Application (Tauri v2)
        id: tauri_build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: 1
          NO_STRIP: true
          # Firma de los paquetes de actualización (actualizador integrado de un clic)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: "npm run tauri"
          tagName: v__VERSION__
          releaseName: 'Kongre App v__VERSION__'
          releaseBody: 'Descarga el instalador nativo de Kongre App para Windows (.exe), macOS (.dmg) o Linux (.rpm / .deb / .AppImage).'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Generate RPM package from DEB (Sanitized Filesystem Ownership)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update && sudo apt-get install -y alien rpm
          mkdir -p src-tauri/target/release/bundle/rpm
          deb_file=$(ls src-tauri/target/release/bundle/deb/*.deb 2>/dev/null | head -n 1)
          if [ -f "$deb_file" ]; then
            echo "Converting $deb_file to RPM with sanitized spec..."
            sudo alien -g -r --scripts "$deb_file"
            spec_dir=$(ls -d */ | grep -E '^kongre-' | head -n 1)
            if [ -z "$spec_dir" ]; then
              spec_dir=$(ls -d */ | head -n 1)
            fi
            echo "Spec directory: $spec_dir"
            cd "$spec_dir"
            spec_file=$(ls *.spec 2>/dev/null | head -n 1)
            if [ -f "$spec_file" ]; then
              echo "Sanitizing system directory ownership in $spec_file..."
              # Eliminar lineas %dir que apunten a directorios estándar de Linux para evitar conflicto con paquete filesystem en Fedora
              sudo sed -i -E '/%dir.*"\/(usr|usr\/bin|usr\/share|usr\/share\/applications|usr\/share\/icons|usr\/share\/icons\/hicolor|usr\/share\/icons\/hicolor\/[0-9x]+|usr\/share\/icons\/hicolor\/[0-9x]+\/apps)"/d' "$spec_file"
              sudo sed -i -E '/^"\/(usr|usr\/bin|usr\/share|usr\/share\/applications|usr\/share\/icons)"$/d' "$spec_file"
              echo "=== SPEC %files section ==="
              grep -A 25 "%files" "$spec_file" || true
              echo "=== Building clean RPM with rpmbuild ==="
              sudo rpmbuild --buildroot "$PWD" -bb "$spec_file"
            fi
            cd ..
            generated_rpm=$(find /root/rpmbuild/RPMS /home/runner/rpmbuild/RPMS ./ -name "*.rpm" 2>/dev/null | head -n 1)
            if [ -n "$generated_rpm" ]; then
              TAG_VERSION=$(node -p "require('./package.json').version")
              sudo cp "$generated_rpm" "src-tauri/target/release/bundle/rpm/Kongre-${TAG_VERSION}-1.x86_64.rpm"
              sudo mv "$generated_rpm" src-tauri/target/release/bundle/rpm/
            fi
            ls -la src-tauri/target/release/bundle/rpm/
          fi

      - name: Upload RPM to Release
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v$(node -p "require('./package.json').version")"
          for rpm in src-tauri/target/release/bundle/rpm/*.rpm; do
            if [ -f "$rpm" ]; then
              echo "Uploading $rpm to release $TAG_NAME..."
              gh release upload "$TAG_NAME" "$rpm" --clobber || true
            fi
          done

      - name: Upload Desktop Artifacts to Actions
        uses: actions/upload-artifact@v4
        with:
          name: kongre-desktop-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.sig
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.sig
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: ignore


