    <!-- Aplica el tema guardado ANTES de pintar (evita parpadeo). Debe ir antes del script de la app. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('kongre-theme') || localStorage.getItem('kongre_theme');
          if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = t;
          if (t === 'dark' || t === 'cabina') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          if (t === 'cabina') {
            document.documentElement.classList.add('theme-cabina');
          } else {
            document.documentElement.classList.remove('theme-cabina');
          }
          var c = { light: '#4C3AED', dark: '#111827', cabina: '#000000' }[t] || '#4C3AED';
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', c);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-indigo-500 selection:text-white">
