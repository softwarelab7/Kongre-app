<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="tileGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <linearGradient id="tileGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c7d2fe" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- 4-Square Panel Grid (Kongre Iconic Emblem) with Shadow -->
  <g filter="url(#shadow)">
    <!-- Top-Left Tile -->
    <rect x="116" y="116" width="126" height="126" rx="28" fill="url(#tileGrad1)" />
    <!-- Top-Right Tile -->
    <rect x="270" y="116" width="126" height="126" rx="28" fill="url(#tileGrad2)" fill-opacity="0.9" />
    <!-- Bottom-Left Tile -->
    <rect x="116" y="270" width="126" height="126" rx="28" fill="url(#tileGrad2)" fill-opacity="0.9" />
    <!-- Bottom-Right Tile -->
    <rect x="270" y="270" width="126" height="126" rx="28" fill="#38bdf8" fill-opacity="0.85" />
  </g>
</svg>
